<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Cristian Bravo · Full Stack Developer · Ecuador</title><desc id="desc">Diseño original para el perfil de Cristian Bravo. Animación sutil compatible con movimiento reducido.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#101e30"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#91f5ce" stop-opacity=".11"/><stop offset="1" stop-color="#91f5ce" stop-opacity="0"/></radialGradient>
