<linearGradient id="line"><stop stop-color="#91f5ce"/><stop offset="1" stop-color="#c5b8ff"/></linearGradient></defs><style>
text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
.flow{stroke-dasharray:7 15;animation:flow 8s linear infinite}.orbit{transform-origin:920px 220px;animation:orbit 42s linear infinite}
.pulse{animation:pulse 5s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-176}}@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.pulse,.float{animation:none}}
