<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Cristian Bravo · Full Stack Developer · Ecuador. Interfaces, APIs y automatización.</title><desc id="desc">Diseño original para el perfil de Cristian Bravo. Animación sutil compatible con movimiento reducido.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#101e30"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#91f5ce" stop-opacity=".11"/><stop offset="1" stop-color="#91f5ce" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#7287a6" stroke-opacity=".075"/></pattern>
<linearGradient id="line"><stop stop-color="#91f5ce"/><stop offset="1" stop-color="#c5b8ff"/></linearGradient></defs><style>
text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
.flow{stroke-dasharray:7 15;animation:none}.orbit{transform-origin:920px 220px;animation:none}
.pulse{animation:none}.float{animation:none}
@keyframes flow{to{stroke-dashoffset:-176}}@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.flow,.orbit,.pulse,.float{animation:none}}
</style>
