<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-labelledby="title desc"><title id="title">Cristian Bravo · Full Stack Developer · Ecuador</title><desc id="desc">Cristian Bravo, creador de CYSTEMS en Ecuador. Full Stack Developer. Web y APIs, automatización e IA aplicada. El nombre permanece fijo; las especialidades aparecen con un efecto de escritura y un diagrama tecnológico muestra órbitas y flujo de datos.</desc><defs><style>text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.typed-static{display:none}.signal{animation:signal-flow 2.6s linear infinite}.orbit-outer{transform-origin:991px 137px;animation:orbit 12s linear infinite}.orbit-inner{transform-origin:991px 137px;animation:orbit 8s linear infinite reverse}.core{animation:float-core 3.6s ease-in-out infinite}@keyframes signal-flow{to{stroke-dashoffset:-60}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float-core{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes type-web{0.0000%{width:0px}10.0000%{width:150.0px}24.0000%{width:150.0px}31.0000%{width:0px}100.0000%{width:0px}}@keyframes cursor-web{0.0000%{transform:translateX(0px);opacity:1}10.0000%{transform:translateX(150.0px);opacity:1}24.0000%{transform:translateX(150.0px);opacity:1}31.0000%{transform:translateX(0px);opacity:1}33.3323%{transform:translateX(0px);opacity:1}33.3333%{transform:translateX(0px);opacity:0}100.0000%{transform:translateX(0px);opacity:0}}.clip-web{animation:type-web 12s steps(10,end) infinite}.cursor-web{animation:cursor-web 12s steps(10,end) infinite}@keyframes type-automation{0.0000%{width:0px}33.3333%{width:0px}43.3333%{width:210.0px}57.3333%{width:210.0px}64.3333%{width:0px}100.0000%{width:0px}}@keyframes cursor-automation{0.0000%{transform:translateX(0px);opacity:0}33.3323%{transform:translateX(0px);opacity:0}33.3333%{transform:translateX(0px);opacity:1}43.3333%{transform:translateX(210.0px);opacity:1}57.3333%{transform:translateX(210.0px);opacity:1}64.3333%{transform:translateX(0px);opacity:1}66.6657%{transform:translateX(0px);opacity:1}66.6667%{transform:translateX(0px);opacity:0}100.0000%{transform:translateX(0px);opacity:0}}.clip-automation{animation:type-automation 12s steps(14,end) infinite}.cursor-automation{animation:cursor-automation 12s steps(14,end) infinite}@keyframes type-ai{0.0000%{width:0px}66.6667%{width:0px}76.6667%{width:165.0px}90.6667%{width:165.0px}97.6667%{width:0px}100.0000%{width:0px}}@keyframes cursor-ai{0.0000%{transform:translateX(0px);opacity:0}66.6657%{transform:translateX(0px);opacity:0}66.6667%{transform:translateX(0px);opacity:1}76.6667%{transform:translateX(165.0px);opacity:1}90.6667%{transform:translateX(165.0px);opacity:1}97.6667%{transform:translateX(0px);opacity:1}100.0000%{transform:translateX(0px);opacity:1}}.clip-ai{animation:type-ai 12s steps(11,end) infinite}.cursor-ai{animation:cursor-ai 12s steps(11,end) infinite}@media(prefers-reduced-motion:reduce){.typed-line{display:none}.typed-static{display:block}.signal,.orbit-outer,.orbit-inner,.core{animation:none}[class^='clip-'],[class^='cursor-']{animation:none}}</style><clipPath id="type-web" clipPathUnits="userSpaceOnUse"><rect x="0" y="-35" width="150.0" height="48" class="clip-web" /></clipPath><clipPath id="type-automation" clipPathUnits="userSpaceOnUse"><rect x="0" y="-35" width="0" height="48" class="clip-automation" /></clipPath><clipPath id="type-ai" clipPathUnits="userSpaceOnUse"><rect x="0" y="-35" width="0" height="48" class="clip-ai" /></clipPath></defs><rect x="1" y="1" width="1198" height="274" rx="24" fill="#0b1220" stroke="#26364c" stroke-width="2" /><path d="M784 1v274" fill="none" stroke="#26364c" /><rect x="40" y="34" width="39" height="30" rx="8" fill="#91f5ce" /><text x="59" y="55" font-size="17" fill="#0b1220" text-anchor="middle" font-weight="800">cb.</text><text x="94" y="56" font-size="15" fill="#9caec2" letter-spacing="2.4" class="mono">CYSTEMS / ECUADOR</text><text x="38" y="148" font-size="76" fill="#eef4f8" font-weight="750" letter-spacing="-3">Cristian <tspan fill="#91f5ce">Bravo</tspan><tspan fill="#c5b8ff">.</tspan></text><text x="42" y="196" font-size="23" fill="#d4dfec" letter-spacing="2" class="mono">FULL STACK DEVELOPER</text><text x="42" y="240" font-size="27" fill="#91f5ce" font-weight="600" class="mono">›</text><g transform="translate(72 240)" class="typed-line" aria-hidden="true"><g clip-path="url(#type-web)"><text x="0" y="0" font-size="25" fill="#91f5ce" textLength="150.0" lengthAdjust="spacingAndGlyphs" class="mono">Web &amp; APIs</text></g><rect x="2" y="-21" width="2.5" height="25" fill="#91f5ce" opacity="1" class="cursor-web" /><g clip-path="url(#type-automation)"><text x="0" y="0" font-size="25" fill="#c5b8ff" textLength="210.0" lengthAdjust="spacingAndGlyphs" class="mono">Automatización</text></g><rect x="2" y="-21" width="2.5" height="25" fill="#c5b8ff" opacity="0" class="cursor-automation" /><g clip-path="url(#type-ai)"><text x="0" y="0" font-size="25" fill="#f5c98b" textLength="165.0" lengthAdjust="spacingAndGlyphs" class="mono">IA aplicada</text></g><rect x="2" y="-21" width="2.5" height="25" fill="#f5c98b" opacity="0" class="cursor-ai" /></g><text x="72" y="240" font-size="21" fill="#9caec2" class="typed-static mono">Web &amp; APIs · Automatización · IA aplicada</text><g transform="translate(0 0)" aria-hidden="true"><g fill="none"><circle cx="991" cy="137" r="100" stroke="#26364c" stroke-width="1.5" /><circle cx="991" cy="137" r="73" stroke="#26364c" stroke-dasharray="3 9" /><path d="M877 80h48v57h66v59h118" stroke="#406358" stroke-width="1.5" /><path d="M877 80h48v57h66v59h118" stroke="#91f5ce" stroke-width="3" stroke-dasharray="10 20" class="signal" /></g><g class="orbit-outer"><path d="M991 37a100 100 0 0 1 86.6 50" fill="none" stroke="#c5b8ff" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".6" /><circle cx="991" cy="37" r="6" fill="#c5b8ff" /><circle cx="991" cy